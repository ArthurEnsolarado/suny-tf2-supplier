[package]
name = "suny-core"
description = "Núcleo do suny's tf2 supplier: Steam, GameBanana, compatibilidade, instalação e logs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
steamlocate = "2.1"
keyvalues-parser = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
png = { version = "0.17", default-features = false }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
thiserror = "2"
tracing = "0.1"

# Janela de escolher pasta (nativa do Windows)
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[dev-dependencies]
tiny_http = "0.12"
